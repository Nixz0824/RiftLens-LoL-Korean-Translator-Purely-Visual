<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">RiftLens data flow and privacy boundary</title>
  <desc id="desc">Screenshots remain in the local processing zone. Only classified OCR text crosses the network boundary to the user-selected translation API, while translated summaries can optionally be sent to Microsoft Edge neural speech.</desc>
  <defs>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbf8"/>
      <stop offset="1" stop-color="#eef7f6"/>
    </linearGradient>
    <linearGradient id="network" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6ff"/>
      <stop offset="1" stop-color="#fbf6fa"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="468" rx="28" fill="#fbfaf9" stroke="#dce5e8"/>
  <text x="52" y="60" fill="#082942" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="720">From one screen region to one useful alert</text>
  <text x="52" y="92" fill="#57748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">A screen-only pipeline with an explicit network boundary</text>

  <rect x="42" y="122" width="720" height="292" rx="22" fill="url(#local)" stroke="#cfe3dc"/>
  <text x="68" y="158" fill="#087a59" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1">LOCAL PROCESSING · SCREENSHOTS STAY HERE</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(66 192)">
      <rect width="196" height="150" rx="17" fill="#ffffff" fill-opacity=".78" stroke="#d6e5df"/>
      <path d="M32 35h26M32 35v26M164 35h-26M164 35v26M32 115h26M32 115V89M164 115h-26M164 115V89" fill="none" stroke="#08b982" stroke-width="3" stroke-linecap="round"/>
      <text x="98" y="76" text-anchor="middle" fill="#082942" font-size="23" font-weight="700">Select region</text>
      <text x="98" y="104" text-anchor="middle" fill="#57748b" font-size="17">ROI capture</text>
    </g>
    <path d="M274 267H308" stroke="#8cb9aa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m299 258 10 9-10 9" fill="none" stroke="#8cb9aa" stroke-width="2.5"/>
    <g transform="translate(320 192)">
      <rect width="196" height="150" rx="17" fill="#ffffff" fill-opacity=".78" stroke="#d6e5df"/>
      <circle cx="98" cy="53" r="22" fill="#e9f8f3" stroke="#a9dfcd"/>
      <path d="M86 53h24M98 41v24" stroke="#08b982" stroke-width="3" stroke-linecap="round"/>
      <text x="98" y="95" text-anchor="middle" fill="#082942" font-size="23" font-weight="700">Stable OCR</text>
      <text x="98" y="123" text-anchor="middle" fill="#57748b" font-size="17">Korean + English</text>
    </g>
    <path d="M528 267H562" stroke="#8cb9aa" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m553 258 10 9-10 9" fill="none" stroke="#8cb9aa" stroke-width="2.5"/>
    <g transform="translate(574 192)">
      <rect width="164" height="150" rx="17" fill="#ffffff" fill-opacity=".78" stroke="#d6e5df"/>
      <circle cx="82" cy="49" r="7" fill="#08b982"/>
      <circle cx="61" cy="70" r="7" fill="#7b72ff"/>
      <circle cx="103" cy="70" r="7" fill="#f0a77e"/>
      <path d="M78 54 65 65M86 54l13 11" stroke="#73909e" stroke-width="2"/>
      <text x="82" y="104" text-anchor="middle" fill="#082942" font-size="21" font-weight="700">Route + dedupe</text>
      <text x="82" y="129" text-anchor="middle" fill="#57748b" font-size="16">chat / ping / system</text>
    </g>
  </g>

  <path d="M762 267H802" stroke="#7b72ff" stroke-width="2.5" stroke-dasharray="7 7"/>
  <path d="m793 258 10 9-10 9" fill="none" stroke="#7b72ff" stroke-width="2.5"/>
  <text x="782" y="239" text-anchor="middle" fill="#6e66ca" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">TEXT ONLY</text>

  <rect x="814" y="122" width="344" height="292" rx="22" fill="url(#network)" stroke="#ded9ee"/>
  <text x="840" y="158" fill="#675fd1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1">OPTIONAL NETWORK SERVICES</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="840" y="188" width="292" height="82" rx="16" fill="#ffffff" fill-opacity=".8" stroke="#e1ddef"/>
    <text x="862" y="221" fill="#082942" font-size="22" font-weight="700">User-configured AI API</text>
    <text x="862" y="250" fill="#57748b" font-size="17">classified OCR text → ZH / EN</text>

    <path d="M986 271v26" stroke="#998fe6" stroke-width="2.5"/>
    <path d="m977 288 9 10 9-10" fill="none" stroke="#998fe6" stroke-width="2.5"/>

    <rect x="840" y="306" width="134" height="78" rx="16" fill="#ffffff" fill-opacity=".8" stroke="#e1ddef"/>
    <text x="907" y="338" text-anchor="middle" fill="#082942" font-size="20" font-weight="700">Overlay</text>
    <text x="907" y="363" text-anchor="middle" fill="#57748b" font-size="16">quiet display</text>
    <rect x="988" y="306" width="144" height="78" rx="16" fill="#ffffff" fill-opacity=".8" stroke="#e1ddef"/>
    <text x="1060" y="338" text-anchor="middle" fill="#082942" font-size="20" font-weight="700">Neural voice</text>
    <text x="1060" y="363" text-anchor="middle" fill="#57748b" font-size="16">spoken summary</text>
  </g>

  <text x="56" y="445" fill="#57748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">No memory reads · no injection · no simulated input · no saved screenshots or persistent chat history</text>
</svg>
