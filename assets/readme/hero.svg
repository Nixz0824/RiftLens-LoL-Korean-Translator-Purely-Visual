<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">RiftLens — screen-only Korean League chat translation</title>
  <desc id="desc">RiftLens turns a selected screen region into locally recognized text, contextual translation, a quiet overlay, and natural speech without reading or modifying the game process.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf9"/>
      <stop offset=".55" stop-color="#f7fbf9"/>
      <stop offset="1" stop-color="#faf7fc"/>
    </linearGradient>
    <radialGradient id="lens" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".36" stop-color="#d9fbf1" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#cbc8ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#f4b6d1" stop-opacity=".45"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08b982"/>
      <stop offset=".58" stop-color="#49bfc9"/>
      <stop offset="1" stop-color="#7b72ff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="30" fill="url(#canvas)" stroke="#dce5e8"/>
  <path d="M54 88H688" stroke="#dbe6e6"/>
  <path d="M54 330H688" stroke="#dbe6e6"/>

  <g transform="translate(54 42)">
    <g transform="translate(0 0)">
      <circle cx="20" cy="20" r="20" fill="url(#lens)" stroke="#ffffff" stroke-width="3"/>
      <circle cx="20" cy="20" r="9" fill="#f8fbfa" stroke="#9fe4d1"/>
      <path d="M9 8A17 17 0 0 1 30 6" fill="none" stroke="#08b982" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 10A17 17 0 0 1 35 29" fill="none" stroke="#7b72ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="58" y="15" fill="#57748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" letter-spacing="2">SCREEN OCR · CONTEXTUAL TRANSLATION · WINDOWS</text>

    <text x="0" y="122" fill="#082942" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="68" font-weight="720" letter-spacing="7">RIFTLENS</text>
    <text x="2" y="171" fill="#17496b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="650">看懂韩服聊天，不碰游戏进程。</text>
    <text x="2" y="207" fill="#57748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Screen-only OCR → game-aware translation → natural speech</text>

    <g transform="translate(0 249)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="650">
      <rect width="128" height="38" rx="19" fill="#e9f8f3" stroke="#bfe8d9"/>
      <circle cx="21" cy="19" r="5" fill="#08b982"/>
      <text x="35" y="25" fill="#087a59">LOCAL OCR</text>
      <rect x="140" width="102" height="38" rx="19" fill="#f0efff" stroke="#d8d4ff"/>
      <text x="163" y="25" fill="#675fd1">ZH / EN</text>
      <rect x="254" width="106" height="38" rx="19" fill="#fff3ed" stroke="#f3d7c7"/>
      <text x="280" y="25" fill="#965e43">BYOK</text>
      <rect x="372" width="90" height="38" rx="19" fill="#f3f6f7" stroke="#d9e2e5"/>
      <text x="398" y="25" fill="#425f72">MIT</text>
    </g>
  </g>

  <g transform="translate(728 42)">
    <rect width="418" height="316" rx="24" fill="#ffffff" fill-opacity=".68" stroke="#d8e3e6"/>
    <text x="28" y="38" fill="#57748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="1.4">SELECTED CHAT REGION</text>
    <rect x="28" y="58" width="362" height="58" rx="14" fill="#f4f7f7" stroke="#dde6e8"/>
    <circle cx="52" cy="87" r="9" fill="#7b72ff"/>
    <text x="73" y="94" fill="#29485d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Malgun Gothic, sans-serif" font-size="21">레오나: 탑 조심, 상대 정글 봐줘</text>

    <path d="M68 146H350" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" text-anchor="middle">
      <circle cx="68" cy="146" r="13" fill="#08b982"/>
      <circle cx="209" cy="146" r="13" fill="#42bdb9"/>
      <circle cx="350" cy="146" r="13" fill="#7b72ff"/>
      <text x="68" y="180" fill="#527184">OCR</text>
      <text x="209" y="180" fill="#527184">ROUTE</text>
      <text x="350" y="180" fill="#527184">TRANSLATE</text>
    </g>

    <rect x="28" y="200" width="362" height="70" rx="15" fill="#eef9f5" stroke="#ccebdc"/>
    <text x="50" y="228" fill="#07865f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">PLAYER CHAT · HIGH PRIORITY</text>
    <text x="50" y="255" fill="#082942" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="650">蕾欧娜：上路小心，也留意对面打野。</text>

    <g transform="translate(30 292)" fill="#08b982">
      <rect x="0" y="8" width="4" height="8" rx="2"/>
      <rect x="10" y="3" width="4" height="18" rx="2"/>
      <rect x="20" y="0" width="4" height="24" rx="2"/>
      <rect x="30" y="5" width="4" height="14" rx="2"/>
      <rect x="40" y="9" width="4" height="6" rx="2"/>
    </g>
    <text x="92" y="309" fill="#57748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">quiet overlay · natural voice</text>
  </g>
</svg>
