name: Bug report / 缺陷反馈
description: Report a reproducible RiftLens problem without sharing private data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not paste API keys, unredacted chat, player names, email addresses, crash dumps, or local paths containing your Windows account name.
        请勿提交 API Key、未脱敏聊天、玩家昵称、邮箱、内含 Windows 用户名的本机路径或未经检查的崩溃转储。
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - OCR / screen capture
        - Message classification
        - Translation
        - Speech
        - Overlay / floating control
        - Chinese UI
        - English UI
        - Build / startup
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: Commit hash or release tag
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      placeholder: Windows version, display scale, game/window mode
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Use synthetic or fully redacted examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed keys, player names, private chat, email addresses, and personal paths. / 我已移除密钥、玩家昵称、私聊、邮箱和个人路径。
          required: true
